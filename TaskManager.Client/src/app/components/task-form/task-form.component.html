<div class="overlay" (click)="cancel()"></div>
<div class="modal">
  <div class="modal-header">
    <h2>{{ isEdit ? '✏️ Edit Task' : '➕ New Task' }}</h2>
    <button class="close-btn" (click)="cancel()">✕</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Title <span class="required">*</span></label>
      <input type="text" formControlName="title" placeholder="Enter task title" />
      <span class="error" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">
        Title is required (max 200 chars)
      </span>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" rows="3" placeholder="Enter description"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select formControlName="status">
          <option [value]="0">Pending</option>
          <option [value]="1">In Progress</option>
          <option [value]="2">Done</option>
        </select>
      </div>

      <div class="form-group">
        <label>Priority</label>
        <select formControlName="priority">
          <option [value]="0">Low</option>
          <option [value]="1">Medium</option>
          <option [value]="2">High</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Due Date</label>
      <input type="date" formControlName="dueDate" />
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-save" [disabled]="form.invalid">
        {{ isEdit ? 'Update Task' : 'Create Task' }}
      </button>
    </div>
  </form>
</div>
